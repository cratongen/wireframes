[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
criterion = "0.8"
flate2 = "1"
num-bigint = "0.4"
num-rational = { version = "0.4", features = ["num-bigint"] }
numpy = "0.29"
proptest = "1"
pyo3 = { version = "0.29", features = ["abi3-py311", "multiple-pymethods"] }
rayon = "1"
robust = "1.2"
spade = "2"
thiserror = "2"
wireframes-core = { path = "crates/core" }
wireframes-io = { path = "crates/io" }
wireframes-ops = { path = "crates/ops" }
wireframes-boolean = { path = "crates/boolean" }
wireframes-query = { path = "crates/query" }
wireframes-build = { path = "crates/build" }

[workspace.lints.clippy]
needless_range_loop = "allow"
type_complexity = "allow"
