site_name: wireframes
site_description: Read, write, plot, measure and combine solids, surfaces and strings for mining, geology and petroleum.
docs_dir: docs
exclude_docs: |
  design/
  hooks.py
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
hooks:
  - docs/hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Guide:
      - Containers and tables: guide/containers.md
      - Files: guide/files.md
      - Measure, validate and repair: guide/measure-repair.md
      - Booleans and cutting: guide/booleans.md
      - Queries: guide/queries.md
      - Construction: guide/construction.md
      - Plotting: guide/plotting.md
  - Examples:
      - Meshes, strings, points and tables: examples/00-basics/README.md
      - Reading and writing files: examples/01-files/README.md
      - Measuring, validating and repairing: examples/02-measure-repair/README.md
      - Booleans, clipping and cut and fill: examples/03-booleans/README.md
      - Points, rays, drillholes and blocks: examples/04-queries/README.md
      - Building surfaces and solids: examples/05-construct/README.md
      - "Open pit: topography to reconciliation": examples/06-open-pit/README.md
      - "Underground: orebody to tonnage report": examples/07-underground/README.md
      - "Files and repair: exports to valid solids": examples/08-files-repair/README.md
