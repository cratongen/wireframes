[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "wireframes"
description = "Read, write, plot, measure and combine solids, surfaces and strings for mining, geology and petroleum"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gustavo Pretto Scholze" }]
keywords = ["mesh", "geometry", "mining", "geology", "boolean", "wireframe"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26"]
dynamic = ["version"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "maturin>=1.10,<2",
    "pytest>=8",
    "ruff>=0.6",
    "matplotlib>=3.8",
    "mkdocs-material>=9.7.7",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "meshio>=5.3.5",
    "trimesh>=5.2.1",
]

[tool.maturin]
manifest-path = "crates/py/Cargo.toml"
module-name = "wireframes._wireframes"
python-source = "python"
locked = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs benchmarks"]

[tool.ruff]
line-length = 110
